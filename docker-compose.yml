# Menjalankan seluruh sistem: PostgreSQL + ML + backend + frontend.
#   docker compose up --build
# UI: http://localhost:8080   API: http://localhost:8000/api   ML: http://localhost:8100/health
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: mm, POSTGRES_DB: mm }
    volumes: [pgdata:/var/lib/postgresql/data]
  ml:
    build: ./ml
    ports: ["8100:8100"]
  backend:
    build: ./backend
    depends_on: [db, ml]
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgres://postgres:mm@db:5432/mm
      ML_URL: http://ml:8100
      FRONTEND_ORIGIN: http://localhost:8080
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  frontend:
    build:
      context: ./frontend
      args: { VITE_API_URL: http://localhost:8000/api }
    depends_on: [backend]
    ports: ["8080:80"]
volumes:
  pgdata:
