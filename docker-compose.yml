# Menjalankan seluruh sistem: PostgreSQL + ML + backend + frontend.
#   docker compose up --build
# UI: http://localhost:8080   API: http://localhost:8000/api   ML: http://localhost:8100/health
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: mm, POSTGRES_DB: mm }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mm"]
      interval: 5s
      timeout: 3s
      retries: 20
  ml:
    build: ./ml
    ports: ["8100:8100"]
    volumes: [ml_profiles:/shared]
    command: ["sh", "-c", "cp artifacts/profiles.json /shared/profiles.json && cp artifacts/metrics.json /shared/ml_metrics.json && exec uvicorn app:app --host 0.0.0.0 --port 8100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 20s
      retries: 12
  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
      ml: { condition: service_healthy }
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgres://postgres:mm@db:5432/mm
      ML_URL: http://ml:8100
      FRONTEND_ORIGIN: http://localhost:8080
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ASSETS_DIR: /shared
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_TECHNICIAN_USERNAME: ${AUTH_TECHNICIAN_USERNAME:-teknisi}
      AUTH_TECHNICIAN_PASSWORD_HASH: ${AUTH_TECHNICIAN_PASSWORD_HASH:-}
      AUTH_SUPERVISOR_USERNAME: ${AUTH_SUPERVISOR_USERNAME:-supervisor}
      AUTH_SUPERVISOR_PASSWORD_HASH: ${AUTH_SUPERVISOR_PASSWORD_HASH:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes: [ml_profiles:/shared:ro]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
  frontend:
    build:
      context: ./frontend
      args: { VITE_API_URL: /api }
    depends_on:
      backend: { condition: service_healthy }
    ports: ["8080:80"]
volumes:
  pgdata:
  ml_profiles:
